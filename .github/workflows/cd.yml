name: CD

on:
  push:
    branches:
      - master_nitro
  release:
    types:
      - created

jobs:
  cancel_previous_runs:
    runs-on: ubuntu-latest
    name: Cancel Previous Runs
    permissions:
      actions: write
    steps:
    - uses: styfle/cancel-workflow-action@0.13.1
      with:
        access_token: ${{ github.token }}

  detect_nitro_release:
    needs: [cancel_previous_runs]
    runs-on: ubuntu-latest
    name: Detect Nitro Release Trigger
    outputs:
      should_release: ${{ steps.detect.outputs.should_release }}
      tag_name: ${{ steps.detect.outputs.tag_name }}
      label: ${{ steps.detect.outputs.label }}
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - name: Detect and prepare Nitro release
      id: detect
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        BEFORE_SHA: ${{ github.event.before }}
        CURRENT_SHA: ${{ github.sha }}
        RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
      run: |
        set -euo pipefail

        if [[ "${EVENT_NAME}" == "release" ]]; then
          tag_name="${RELEASE_TAG_NAME}"
          label="${tag_name#v}"
          echo "should_release=false" >> "$GITHUB_OUTPUT"
          echo "tag_name=${tag_name}" >> "$GITHUB_OUTPUT"
          echo "label=${label}" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        upstream_minor="$(sed -n 's/^[[:space:]]*VERSION[[:space:]]\+\([0-9]\+\.[0-9]\+\).*/\1/p' CMakeLists.txt | head -n 1)"
        nitro_rev="$(tr -d '[:space:]' < NITRO_VERSION)"
        if [[ -z "${upstream_minor}" || ! "${nitro_rev}" =~ ^[0-9]+$ ]]; then
          echo "Invalid version metadata" >&2
          exit 1
        fi

        label="${upstream_minor}.0-nitro.${nitro_rev}"
        tag_name="v${label}"

        changed="false"
        if [[ "${BEFORE_SHA}" == "0000000000000000000000000000000000000000" ]]; then
          if git show --name-only --pretty="" "${CURRENT_SHA}" | grep -qx "NITRO_VERSION"; then
            changed="true"
          fi
        else
          if git diff --name-only "${BEFORE_SHA}" "${CURRENT_SHA}" | grep -qx "NITRO_VERSION"; then
            changed="true"
          fi
        fi

        should_release="false"
        if [[ "${changed}" == "true" ]]; then
          if git ls-remote --exit-code --tags origin "refs/tags/${tag_name}" >/dev/null 2>&1; then
            echo "Tag ${tag_name} already exists; skipping auto-release."
          else
            should_release="true"
            echo "Will create release for ${tag_name} after successful builds."
          fi
        fi

        echo "should_release=${should_release}" >> "$GITHUB_OUTPUT"
        echo "tag_name=${tag_name}" >> "$GITHUB_OUTPUT"
        echo "label=${label}" >> "$GITHUB_OUTPUT"

  test_ubuntu:
    needs: [cancel_previous_runs, detect_nitro_release]
    runs-on: ubuntu-latest
    name: Test Ubuntu
    steps:
    - uses: actions/checkout@v6
    - name: Install Dependencies
      run: .github/scripts/install-ubuntu.sh
    - name: Build & Test
      run: .github/scripts/build-ubuntu.sh

  test_windows:
    needs: [cancel_previous_runs, detect_nitro_release]
    runs-on: windows-2022
    name: Test Windows
    steps:
    - uses: actions/checkout@v6
    - name: Install Dependencies
      run: .github/scripts/install-windows.sh
      shell: bash
    - name: Build & Test
      run: .github/scripts/build-windows.sh
      shell: bash

  test_macos:
    needs: [cancel_previous_runs, detect_nitro_release]
    runs-on: macos-latest
    name: Test macOS
    steps:
    - uses: actions/checkout@v6
    - name: Install Dependencies
      run: .github/scripts/install-macos.sh ci
    - name: Build & Test
      run: .github/scripts/build-macos.sh debug arm64 && .github/scripts/build-macos.sh debug x86_64

  build_release_windows:
    needs: [detect_nitro_release, test_ubuntu, test_windows, test_macos]
    name: Build Release Windows
    if: github.event_name == 'release' || (github.event_name == 'push' && needs.detect_nitro_release.outputs.should_release == 'true')
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - name: Install Dependencies
        run: .github/scripts/install-windows.sh
        shell: bash
      - name: Build & Test
        run: .github/scripts/build-windows.sh release
        shell: bash
      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: windows_single_core_x86
          path: build/bin/RelWithDebInfo/solvespace_single_core_x86.exe

  build_release_windows_openmp:
    needs: [detect_nitro_release, test_ubuntu, test_windows, test_macos]
    name: Build Release Windows (OpenMP)
    if: github.event_name == 'release' || (github.event_name == 'push' && needs.detect_nitro_release.outputs.should_release == 'true')
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - name: Install Dependencies
        run: .github/scripts/install-windows.sh
        shell: bash
      - name: Build & Test
        run: .github/scripts/build-windows.sh release openmp
        shell: bash
      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: windows_x86
          path: build/bin/RelWithDebInfo/solvespace_x86.exe

  build_release_windows_x64:
    needs: [detect_nitro_release, test_ubuntu, test_windows, test_macos]
    name: Build Release Windows x64
    if: github.event_name == 'release' || (github.event_name == 'push' && needs.detect_nitro_release.outputs.should_release == 'true')
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - name: Install Dependencies
        run: .github/scripts/install-windows.sh
        shell: bash
      - name: Build & Test
        run: .github/scripts/build-windows.sh release not_openmp x64
        shell: bash
      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: windows_single_core_x64
          path: build/bin/RelWithDebInfo/solvespace_single_core_x64.exe

  build_release_windows_openmp_x64:
    needs: [detect_nitro_release, test_ubuntu, test_windows, test_macos]
    name: Build Release Windows (OpenMP) x64
    if: github.event_name == 'release' || (github.event_name == 'push' && needs.detect_nitro_release.outputs.should_release == 'true')
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - name: Install Dependencies
        run: .github/scripts/install-windows.sh
        shell: bash
      - name: Build & Test
        run: .github/scripts/build-windows.sh release openmp x64
        shell: bash
      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: windows_x64
          path: build/bin/RelWithDebInfo/solvespace_x64.exe

  build_release_macos:
    needs: [detect_nitro_release, test_ubuntu, test_windows, test_macos]
    name: Build Release macOS
    if: github.event_name == 'release' || (github.event_name == 'push' && needs.detect_nitro_release.outputs.should_release == 'true')
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v6
    - name: Install Dependencies
      run: .github/scripts/install-macos.sh ci
    - name: Build & Test
      run: .github/scripts/build-macos.sh release arm64 && .github/scripts/build-macos.sh release x86_64
    - name: Sign Build
      run: .github/scripts/sign-macos.sh
      env:
        MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
        MACOS_APPSTORE_APP_PASSWORD: ${{ secrets.MACOS_APPSTORE_APP_PASSWORD }}
        MACOS_APPSTORE_USERNAME: ${{ secrets.MACOS_APPSTORE_USERNAME }}
        MACOS_DEVELOPER_ID: ${{ secrets.MACOS_DEVELOPER_ID }}
    - name: Upload artifact
      uses: actions/upload-artifact@v6
      with:
        name: macos
        path: build/bin/SolveSpaceNitro.dmg

  build_release_web:
    needs: [detect_nitro_release, test_ubuntu, test_windows, test_macos]
    name: Build Release Web
    if: github.event_name == 'release' || (github.event_name == 'push' && needs.detect_nitro_release.outputs.should_release == 'true')
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Install Dependencies
      run: .github/scripts/install-web.sh
    - name: Build & Pack
      run: |
        .github/scripts/build-web.sh release
        cd build/bin
        rm *.a || true
    - name: Upload artifact
      uses: actions/upload-artifact@v6
      with:
        name: solvespace_web
        path: build/bin/
    - name: Ping solvespace.com
      env:
        WEB_SITE_PING_KEY: ${{ secrets.PULL_WEBVER_KEY }}
      run: |
        curl https://solvespace.com/pull-webver.pl?key=${WEB_SITE_PING_KEY}

