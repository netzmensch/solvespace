  upload_release_assets:
    name: Upload Release Assets
    needs: [detect_nitro_release, build_release_windows, build_release_windows_openmp, build_release_windows_x64, build_release_windows_openmp_x64, build_release_macos]
    if: "!cancelled() && (github.event_name == 'release' || (github.event_name == 'push' && needs.detect_nitro_release.outputs.should_release == 'true'))"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download All Workflow Artifacts
      uses: actions/download-artifact@v8
    - name: Ensure release exists
      if: github.event_name == 'push'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG_NAME: ${{ needs.detect_nitro_release.outputs.tag_name }}
        LABEL: ${{ needs.detect_nitro_release.outputs.label }}
        TARGET_SHA: ${{ github.sha }}
      run: |
        set -euo pipefail
        if ! gh release view "${TAG_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
          gh release create "${TAG_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${TARGET_SHA}" \
            --title "SolveSpace ${LABEL}" \
            --generate-notes
        fi
    - name: Upload release assets
      shell: bash
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG_NAME: ${{ needs.detect_nitro_release.outputs.tag_name }}
        LABEL: ${{ needs.detect_nitro_release.outputs.label }}
      run: |
        set -euo pipefail

        for required in \
          windows/solvespace.exe \
          windows_single_core/solvespace_single_core.exe \
          windows_x64/solvespace_x64.exe \
          windows_single_core_x64/solvespace_single_core_x64.exe \
          macos/SolveSpaceNitro.dmg; do
          if [[ ! -f "${required}" ]]; then
            echo "Missing release artifact: ${required}" >&2
            exit 1
          fi
        done

        tmpdir="$(mktemp -d)"
        trap 'rm -rf "${tmpdir}"' EXIT

        cp windows/solvespace.exe "${tmpdir}/SolveSpace-${LABEL}.exe"
        cp windows_single_core/solvespace_single_core.exe "${tmpdir}/SolveSpace-${LABEL}_single_core.exe"
        cp windows_x64/solvespace_x64.exe "${tmpdir}/SolveSpace-${LABEL}_x64.exe"
        cp windows_single_core_x64/solvespace_single_core_x64.exe "${tmpdir}/SolveSpace-${LABEL}_single_core_x64.exe"
        cp macos/SolveSpaceNitro.dmg "${tmpdir}/SolveSpace-${LABEL}.dmg"

        gh release upload "${TAG_NAME}" "${tmpdir}"/* \
          --repo "${GITHUB_REPOSITORY}" \
          --clobber
